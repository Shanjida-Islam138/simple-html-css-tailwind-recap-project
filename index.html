<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>

    <!--tailwind cdn-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--fontawesome cdn-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!---banner section starts here-->
    <div class ="parent_div flex flex-col md:flex-row justify-between items-center min-h-[200px] max-w-[1250px] mx-auto relative top-[50px]">
        <div class = "left_div">
            <h1 class="text-[80px] font-bold">It's good <br/>
                tea time at The<br/> Tea House</h1>
            <p class="text-[18px] my-10">Tea and Botanical Solutions Supplier Give Optimum <br/>Satisfaction To Your Taste Buds.</p>
            <button class="w-[200px] h-[64px] text-[20px] text-white rounded-lg bg-gradient-to-r from-[#FF8938] to-[#FF0000]"><span>Explore More</span><span><i class="fa-solid fa-arrow-right -rotate-45"></i></span></button>

        </div>

        <div class = "right_div relative">
            <img src="./images/banner.png" class="relative top-[120px]">
            <div class="w-[255px] h-[100px] flex  bg-white items-center rounded-lg shadow-lg absolute left-[100px]">
                <span class="text-4xl text-ye"><i class="fa-solid fa-star text-[#FFC850]"></i></span>
                <div class="ml-4">
                    <p class="font-bold text-[30px]">5.00</p>
                    <p>Trust Pilot Ratings</p>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
